name: CI

# Portão de qualidade: roda em cada push/PR na main. O build do EasyPanel só
# roda `next build` (que NÃO executa lint nem testes), então o CI é o único
# lugar que valida tipos + lint + testes antes do deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
